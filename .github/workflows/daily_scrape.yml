name: Daily Job Scraping

permissions:
  contents: write

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/scrape_jobs.py

      - name: Run agent
        env: 
          OPENAI_API_KEY: ${{secrets.OPENAI_API_KEY}}
        run: python agent/process_jobs.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/jobs_clean.json data/processed/seen_jobs.json
          git diff --staged --quiet || git commit -m "Auto-update job data [skip ci]"
          git push